<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366F1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="82" r="68" fill="url(#logoGrad)" filter="url(#shadow)"/>

  <!-- Calendar page body -->
  <rect x="58" y="46" width="58" height="64" rx="6" fill="white" opacity="0.95"/>

  <!-- Calendar rings -->
  <rect x="62" y="42" width="6" height="12" rx="2" fill="#E0E7FF"/>
  <rect x="74" y="42" width="6" height="12" rx="2" fill="#E0E7FF"/>
  <rect x="86" y="42" width="6" height="12" rx="2" fill="#E0E7FF"/>
  <rect x="98" y="42" width="6" height="12" rx="2" fill="#E0E7FF"/>

  <!-- Horizontal line on calendar -->
  <line x1="58" y1="56" x2="116" y2="56" stroke="#C7D2FE" stroke-width="2"/>

  <!-- Checkmark - stylized -->
  <path d="M68 76 L78 86 L98 66" stroke="url(#checkGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Small dots representing days -->
  <circle cx="66" cy="96" r="2.5" fill="#C7D2FE"/>
  <circle cx="76" cy="96" r="2.5" fill="#C7D2FE"/>
  <circle cx="86" cy="96" r="2.5" fill="#C7D2FE"/>
  <circle cx="96" cy="96" r="2.5" fill="#C7D2FE"/>
  <circle cx="106" cy="96" r="2.5" fill="#C7D2FE"/>

  <!-- Arabic text يومي -->
  <text x="100" y="168" text-anchor="middle" font-family="'Segoe UI', 'Noto Sans Arabic', 'Arial', sans-serif" font-size="36" font-weight="700" fill="#6366F1" direction="rtl">يومي</text>

  <!-- Subtle underline accent -->
  <rect x="72" y="176" width="56" height="3" rx="1.5" fill="url(#checkGrad)" opacity="0.6"/>
</svg>