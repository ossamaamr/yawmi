<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="splashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="splashCheck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="splashShadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4338CA" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Centered logo group -->
  <g transform="translate(256, 220)">

    <!-- Background circle -->
    <circle cx="0" cy="0" r="130" fill="url(#splashGrad)" filter="url(#splashShadow)"/>

    <!-- Calendar page body -->
    <rect x="-68" y="-88" width="112" height="128" rx="10" fill="white" opacity="0.95"/>

    <!-- Calendar top bar -->
    <rect x="-68" y="-88" width="112" height="20" rx="10" fill="#E0E7FF"/>
    <rect x="-68" y="-80" width="112" height="12" fill="#E0E7FF"/>

    <!-- Calendar rings -->
    <rect x="-58" y="-100" width="10" height="20" rx="3.5" fill="#C7D2FE"/>
    <rect x="-40" y="-100" width="10" height="20" rx="3.5" fill="#C7D2FE"/>
    <rect x="-22" y="-100" width="10" height="20" rx="3.5" fill="#C7D2FE"/>
    <rect x="-4" y="-100" width="10" height="20" rx="3.5" fill="#C7D2FE"/>
    <rect x="14" y="-100" width="10" height="20" rx="3.5" fill="#C7D2FE"/>
    <rect x="32" y="-100" width="10" height="20" rx="3.5" fill="#C7D2FE"/>
    <rect x="50" y="-100" width="10" height="20" rx="3.5" fill="#C7D2FE"/>

    <!-- Separator line -->
    <line x1="-68" y1="-72" x2="44" y2="-72" stroke="#DDD6FE" stroke-width="2.5"/>

    <!-- Checkmark -->
    <path d="M-50 -30 L-32 -12 L8 -48" stroke="url(#splashCheck)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Dots row 1 -->
    <circle cx="-52" cy="10" r="4" fill="#DDD6FE"/>
    <circle cx="-38" cy="10" r="4" fill="#DDD6FE"/>
    <circle cx="-24" cy="10" r="4" fill="#DDD6FE"/>
    <circle cx="-10" cy="10" r="4" fill="#DDD6FE"/>
    <circle cx="4" cy="10" r="4" fill="#DDD6FE"/>
    <circle cx="18" cy="10" r="4" fill="#DDD6FE"/>
    <circle cx="32" cy="10" r="4" fill="#DDD6FE"/>

    <!-- Dots row 2 -->
    <circle cx="-52" cy="26" r="4" fill="#DDD6FE"/>
    <circle cx="-38" cy="26" r="4" fill="#DDD6FE"/>
    <circle cx="-24" cy="26" r="4" fill="#DDD6FE"/>
    <circle cx="-10" cy="26" r="4" fill="#C7D2FE"/>
    <circle cx="4" cy="26" r="4" fill="#C7D2FE"/>
    <circle cx="18" cy="26" r="4" fill="#C7D2FE"/>
    <circle cx="32" cy="26" r="4" fill="#C7D2FE"/>
  </g>

  <!-- Arabic text يومي -->
  <text x="256" y="410" text-anchor="middle" font-family="'Segoe UI', 'Noto Sans Arabic', 'Arial', sans-serif" font-size="64" font-weight="700" fill="#6366F1" direction="rtl">يومي</text>

  <!-- Subtle underline accent -->
  <rect x="186" y="424" width="140" height="5" rx="2.5" fill="url(#splashCheck)" opacity="0.5"/>
</svg>