name: Build Android APK (Optimized)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v4

      - name: ⚙️ إعداد Node.js (الإصدار 20 المطلوب)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 تثبيت التبعيات (مع تجاوز التعارضات)
        run: npm install --legacy-peer-deps

      - name: 🧪 التحقق من صحة ملف app.json
        run: npx expo config --json

      - name: ☕ إعداد Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: 🛠️ إنشاء مجلد Android وبناء APK
        run: |
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: true
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: 📤 رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: yawmi-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
